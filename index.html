<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilaarr AI: Cultural Curriculum Coach (test)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="bilaarr-mark.webp">
  <style>
    :root { --bg: #f6f7f4; --fg: #1f2a24; --muted: #5f6b63; --green: #4caf50; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 28px 16px 32px; }
    header { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 900px; margin-bottom: 20px; }
    .row { display: flex; align-items: center; justify-content: center; gap: 22px; }
    .portrait { width: 150px; height: 150px; object-fit: contain; flex: none; }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .mark { height: 74px; width: auto; margin-bottom: 4px; }
    h1 { font-size: 2.4rem; font-weight: 500; letter-spacing: .01em; margin: 0; line-height: 1.1; }
    .tagline { margin: 4px 0 0; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--fg); }
    .note { margin: 12px 0 0; font-size: .9rem; color: var(--muted); text-align: center; }
    #chirpy-agent { width: 100%; max-width: 900px; height: min(780px, calc(100vh - 260px)); min-height: 560px; }
    footer { margin-top: 14px; font-size: .8rem; color: var(--muted); text-align: center; }
    @media (max-width: 600px) {
      body { padding: 20px 12px 24px; }
      .row { gap: 14px; }
      .portrait { width: 100px; height: 100px; }
      .mark { height: 46px; }
      h1 { font-size: 1.6rem; }
      .tagline { font-size: .55rem; letter-spacing: .1em; }
      .note { font-size: .8rem; }
      #chirpy-agent { height: calc(100vh - 230px); min-height: 480px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="row">
      <img class="portrait" src="bilaarr-portrait.webp" alt="Bilaarr AI">
      <div class="brand">
        <img class="mark" src="bilaarr-mark.webp" alt="">
        <h1>Bilaarr Ai</h1>
        <p class="tagline">Rooted in culture. Designed for tomorrow.</p>
      </div>
    </div>
    <p class="note">Cultural Curriculum Coach. Test deployment for TIPIAC Pty Ltd.</p>
  </header>

  <!-- Size this container to fit your layout -->
  <div id="chirpy-agent"></div>
  <script>
    window.chirpyAIConfig = {
      chatbotId: "109f33d6-d229-4987-b771-d6487fa854a4",
      mode: "inline",
      target: "#chirpy-agent"
    };
  </script>
  <script src="https://www.chirpy.biz/widget.js" defer></script>

  <footer>Please don't enter student names or other personal information.</footer>
</body>
</html>
